server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types: application/json,text/html,text/css,application/javascript

spring:
  application:
    name: aerolab-windtunnel
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    root: INFO
    com.aerolab: INFO
